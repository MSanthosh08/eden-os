[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "eden-os"
version = "0.1.0"
description = "EDEN — a modular AI Operating System."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary" }
authors = [{ name = "EDEN Core Team" }]
dependencies = []

[project.scripts]
eden = "eden.interface.cli:main"

[project.optional-dependencies]
http = ["httpx>=0.27"]
dev = [
    "black>=24.0",
    "httpx>=0.27",
    "mypy>=1.10",
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
eden = ["py.typed"]

# --------------------------------------------------------------------------
# Formatting
# --------------------------------------------------------------------------
[tool.black]
line-length = 100
target-version = ["py312"]

# --------------------------------------------------------------------------
# Linting
# --------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "A",   # builtin shadowing
    "ANN", # missing annotations
    "ARG", # unused arguments
    "B",   # bugbear
    "BLE", # blind except
    "C4",  # comprehensions
    "D",   # docstrings
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # import order
    "N",   # naming
    "PERF",# performance anti-patterns
    "PL",  # pylint subset
    "PTH", # use pathlib
    "RET", # return consistency
    "RUF", # ruff specific
    "S",   # security (bandit)
    "SIM", # simplify
    "T20", # no print
    "TID", # tidy imports
    "UP",  # pyupgrade
    "W",   # pycodestyle warnings
]
ignore = [
    "D203", # incompatible with D211
    "D213", # incompatible with D212
]

[tool.ruff.lint.per-file-ignores]
# Test code is allowed to assert, use fixed temp paths, seed the stdlib RNG,
# import locally inside a case, and take many fixtures.
# build_router assembles the whole API surface; splitting a route table across
# files hides it. main() dispatches one subcommand per branch.
"src/eden/interface/api.py" = ["PLR0915"]
"src/eden/interface/cli.py" = ["PLR0911"]
"tests/*" = [
    "ANN401",
    "ARG",   # test doubles must match a signature they do not use
    "D",
    "N818",
    "PLC0415",
    "PLR0913",
    "PLR2004",
    "S101",
    "S108",
    "S311",
]

[tool.ruff.lint.pylint]
# Constructors and policy helpers take keyword-only dependencies by design;
# the alternative is opaque **kwargs, which defeats strict typing.
max-args = 8
max-returns = 8

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.lint.pydocstyle]
convention = "google"

# --------------------------------------------------------------------------
# Typing
# --------------------------------------------------------------------------
[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
disallow_any_generics = true
no_implicit_reexport = true
show_error_codes = true
files = ["src", "tests"]

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_decorators = false

# --------------------------------------------------------------------------
# Testing
# --------------------------------------------------------------------------
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q --strict-markers"
markers = ["integration: exercises more than one subsystem"]
